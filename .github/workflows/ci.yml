name: engineering-core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm run verify
        working-directory: web

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release --target wasm32-unknown-unknown -p pipe_sim_wasm
      - run: cargo run --locked -p pipe_sim_cli -- --scenario scenarios/gearbox_acceptance.json --report out/gearbox_acceptance.json
      - uses: actions/upload-artifact@v7
        with:
          name: acceptance-report
          path: out/gearbox_acceptance.json

  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r cad/requirements.txt
      - run: python -m pytest cad/tests
      - run: mkdir -p cad/out && python cad/scripts/validate_parameters.py > cad/out/manifest.json
      - uses: actions/upload-artifact@v7
        with:
          name: cad-manifest
          path: cad/out/manifest.json
